name: Deploy DarkCloud EMS

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}

permissions:
  id-token: write   # For OIDC authentication with AWS
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────
  # Job 1: Run tests
  # ────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm nx run-many -t test --parallel=3

  # ────────────────────────────────────────────────────────────────
  # Job 2: Build & push Docker images to ECR
  # ────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    outputs:
      frontend-image: ${{ steps.build-frontend.outputs.image }}
      backend-image: ${{ steps.build-backend.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: tags
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${SHA}" >> $GITHUB_OUTPUT
          echo "registry=${{ steps.ecr-login.outputs.registry }}" >> $GITHUB_OUTPUT

      - name: Build & push frontend image
        id: build-frontend
        run: |
          IMAGE="${{ steps.tags.outputs.registry }}/darkcloud-${{ env.ENVIRONMENT }}-frontend"
          docker build \
            -f apps/frontend/Dockerfile \
            -t ${IMAGE}:${{ steps.tags.outputs.tag }} \
            -t ${IMAGE}:latest \
            .
          docker push ${IMAGE}:${{ steps.tags.outputs.tag }}
          docker push ${IMAGE}:latest
          echo "image=${IMAGE}:${{ steps.tags.outputs.tag }}" >> $GITHUB_OUTPUT

      - name: Build & push backend image
        id: build-backend
        run: |
          IMAGE="${{ steps.tags.outputs.registry }}/darkcloud-${{ env.ENVIRONMENT }}-backend"
          docker build \
            -f apps/backend/Dockerfile \
            -t ${IMAGE}:${{ steps.tags.outputs.tag }} \
            -t ${IMAGE}:latest \
            .
          docker push ${IMAGE}:${{ steps.tags.outputs.tag }}
          docker push ${IMAGE}:latest
          echo "image=${IMAGE}:${{ steps.tags.outputs.tag }}" >> $GITHUB_OUTPUT

  # ────────────────────────────────────────────────────────────────
  # Job 3: Deploy infrastructure with CDK
  # ────────────────────────────────────────────────────────────────
  deploy-infra:
    name: Deploy Infrastructure (CDK)
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        working-directory: infra
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Diff
        working-directory: infra
        run: npx cdk diff -c environment=${{ env.ENVIRONMENT }}

      - name: CDK Deploy
        working-directory: infra
        run: npx cdk deploy --all --require-approval never -c environment=${{ env.ENVIRONMENT }}

  # ────────────────────────────────────────────────────────────────
  # Job 4: Update ECS services to use new images
  # ────────────────────────────────────────────────────────────────
  deploy-services:
    name: Deploy ECS Services
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-infra]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new deployment of frontend
        run: |
          aws ecs update-service \
            --cluster darkcloud-${{ env.ENVIRONMENT }} \
            --service darkcloud-${{ env.ENVIRONMENT }}-frontend \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Force new deployment of backend
        run: |
          aws ecs update-service \
            --cluster darkcloud-${{ env.ENVIRONMENT }} \
            --service darkcloud-${{ env.ENVIRONMENT }}-backend \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for frontend service stability
        run: |
          aws ecs wait services-stable \
            --cluster darkcloud-${{ env.ENVIRONMENT }} \
            --services darkcloud-${{ env.ENVIRONMENT }}-frontend \
            --region ${{ env.AWS_REGION }}

      - name: Wait for backend service stability
        run: |
          aws ecs wait services-stable \
            --cluster darkcloud-${{ env.ENVIRONMENT }} \
            --services darkcloud-${{ env.ENVIRONMENT }}-backend \
            --region ${{ env.AWS_REGION }}

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | \`${{ needs.build-and-push.outputs.frontend-image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | \`${{ needs.build-and-push.outputs.backend-image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
